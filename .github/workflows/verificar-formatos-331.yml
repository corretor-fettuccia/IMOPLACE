name: Verificar formatos 3.3.1
on:
  push:
    paths:
      - 'scripts/**'
      - 'site/assets/js/midias.js'
      - 'atualizacoes/core-3.3.1/**'
      - '.github/workflows/verificar-formatos-331.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: imoplace-verificar-formatos
  cancel-in-progress: true
jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Dependências de validação
        run: pip install 'Pillow>=11.3,<13' 'pillow-jxl-plugin==1.3.8' 'pywebpush==2.5.0'
      - name: Compilar Python
        run: python -m compileall -q scripts
      - name: Validar complemento e atualizador Node
        run: node scripts/tests/test_formatos331_node.cjs
      - name: Testes completos sem credenciais e sem publicação
        run: python -m unittest discover -s scripts/tests -t scripts
