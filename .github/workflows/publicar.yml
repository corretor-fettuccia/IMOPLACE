name: Publicar ImoPlace v2.3.2.6
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      motivo:
        description: Origem do disparo
        required: false
        default: manual
      forcar:
        description: Reconstrução de todos os imóveis (requer confirmação na API)
        type: boolean
        required: false
        default: false

concurrency:
  group: imoplace-publicar
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
    env:
      API_INTEGRACAO_ACTIONS_URL: ${{ secrets.API_INTEGRACAO_ACTIONS_URL }}
      SEGREDO_INTEGRACAO: ${{ secrets.SEGREDO_INTEGRACAO }}
      API_PUBLICA_URL: ${{ vars.API_PUBLICA_URL }}
      FORCAR: ${{ inputs.forcar || 'false' }}
      MOTIVO: ${{ inputs.motivo || github.event_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar nomenclatura e configuracao das APIs
        run: python -u scripts/verificar_configuracao.py --workflow
      - name: Testes sem rede
        run: |
          python -m unittest discover -s scripts/tests -t scripts
      - name: '[1/8] Sincronizar fila Apps Script'
        id: fila
        run: python -u scripts/sincronizar.py
      - name: Autenticação Drive somente leitura
        id: google
        if: steps.fila.outputs.tem == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          create_credentials_file: false
      - name: '[2/8] Montar catálogo candidato'
        if: steps.fila.outputs.tem == 'true'
        run: python -u scripts/montar_catalogo.py
      - name: '[3/8] Montar imóveis e baixar WebP incrementais'
        if: steps.fila.outputs.tem == 'true'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python -u scripts/montar_imoveis.py
      - name: '[4/8] Montar sitemap, robots e feeds'
        if: steps.fila.outputs.tem == 'true'
        run: python -u scripts/montar_extras.py
      - name: '[5/8] Validar publicação'
        if: steps.fila.outputs.tem == 'true'
        run: python -u scripts/validar.py
      - name: '[6/8] Montar artefato público'
        if: steps.fila.outputs.tem == 'true'
        run: python -u scripts/montar_site.py
      - name: Verificar reserva de versões antes de publicar
        if: steps.fila.outputs.tem == 'true'
        run: python -u scripts/publicar.py validar-reserva
      - name: Commit de imagens e páginas (apenas mudanças)
        if: steps.fila.outputs.tem == 'true'
        run: |
          git config user.name 'imoplace-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A site
          if git diff --cached --quiet; then
            echo 'Sem alterações em site/'
          else
            git commit -m "ImoPlace v2.3.2: publicação ${{ github.run_id }}"
            git push
          fi
      - name: Configurar GitHub Pages
        if: steps.fila.outputs.tem == 'true'
        uses: actions/configure-pages@v5
      - name: Enviar artefato público
        if: steps.fila.outputs.tem == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: estado/publicacao
      - name: Deploy GitHub Pages
        id: deploy
        if: steps.fila.outputs.tem == 'true'
        uses: actions/deploy-pages@v4
      - name: '[7/8] Conferir site publicado'
        if: steps.fila.outputs.tem == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.deploy.outputs.page_url }}
        run: python -u scripts/conferir.py
      - name: '[8/8] Confirmar publicação ao painel'
        if: steps.fila.outputs.tem == 'true'
        run: python -u scripts/confirmar.py
      - name: Reportar erro e liberar fila
        if: failure() && steps.fila.outputs.tem == 'true'
        env:
          MOTIVO_FALHA: 'Erro na publicação v2.3.2; consulte GitHub Actions.'
        run: python -u scripts/publicar.py falha
