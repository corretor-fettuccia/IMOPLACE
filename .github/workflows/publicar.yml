name: Publicar ImoPlace — CORE
on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "site/assets/**"
      - "site/adm/**"
      - "site/pictures/**"
      - "adm/**"
      - "imoplace.json"
      - "VERSAO"
      - ".github/workflows/publicar.yml"
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      motivo:
        description: Origem da solicitação
        required: false
        default: manual
      forcar:
        description: Reprocessar imóveis com erro (não faz reconstrução completa)
        type: boolean
        required: false
        default: false

concurrency:
  group: imoplace-publicar
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
    env:
      CORE_GOOGLE: '1'
      IMOPLACE_IMAGENS_ADAPTATIVAS: ${{ vars.IMOPLACE_IMAGENS_ADAPTATIVAS || '1' }}
      IMOPLACE_AVIF: ${{ vars.IMOPLACE_AVIF || '0' }}
      IMOPLACE_JXL: ${{ vars.IMOPLACE_JXL || '0' }}
      PLANILHA_ID: ${{ secrets.PLANILHA_ID || vars.PLANILHA_ID }}
      FORCAR: ${{ inputs.forcar || 'false' }}
      MOTIVO: ${{ inputs.motivo || github.event_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar conversor de imagens
        run: pip install 'Pillow>=11.3,<13' 'pillow-jxl-plugin==1.3.8' 'pywebpush==2.5.0'
      - name: Node 24 para matriz JXL sem perdas
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Autenticar Google (Sheets leitura/escrita, Drive somente leitura)
        id: google
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets,https://www.googleapis.com/auth/drive.readonly
          create_credentials_file: false
      - name: Carregar configurações operacionais do CORE
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python -u scripts/core_configurar.py
      - name: Validar sintaxe Python e mídias JS
        run: |
          python -m compileall -q scripts
          node scripts/tests/test_midias_node.js
      - name: Testes do motor sem rede
        run: |
          python -m unittest discover -s scripts/tests -t scripts
      - name: '[1/8] Consultar FILA na planilha'
        id: fila
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python -u scripts/sincronizar.py
      - name: '[2/8] Construir catálogo candidato'
        if: steps.fila.outputs.tem == 'true'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python -u scripts/montar_catalogo.py
      - name: '[3/8] Construir páginas e obter fotos'
        if: steps.fila.outputs.tem == 'true'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python -u scripts/montar_imoveis.py
      - name: '[4/8] Gerar sitemap e feeds'
        if: steps.fila.outputs.tem == 'true'
        run: python -u scripts/montar_extras.py
      - name: Construir notícias e configuração pública de avisos
        id: noticias
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: |
          python -u scripts/noticias.py
          python -u scripts/marketing.py site
          if [[ -n "$(git status --porcelain -- site)" ]]; then
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          else
            echo "mudou=false" >> "$GITHUB_OUTPUT"
          fi
      - name: '[5/8] Validar conteúdo'
        if: steps.fila.outputs.tem == 'true'
        run: python -u scripts/validar.py
      - name: '[6/8] Montar artefato'
        if: steps.fila.outputs.tem == 'true'
        run: python -u scripts/montar_site.py
      - name: Verificar estrutura pública
        if: steps.fila.outputs.tem == 'true'
        run: python -u scripts/verificar_publicacao.py --artefato
      - name: Validar versões antes de publicar
        if: steps.fila.outputs.tem == 'true'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python -u scripts/publicar.py validar-reserva
      - name: Commit das páginas e fotos
        if: steps.fila.outputs.tem == 'true'
        run: |
          git config user.name 'imoplace-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A site
          if ! git diff --cached --quiet; then
            git commit -m "ImoPlace CORE: publicação ${{ github.run_id }}"
            git push
          fi
      # Publicação manual de ajustes visuais, quando nenhum imóvel precisa sincronizar.
      # Não reserva nem confirma versões de imóveis; mantém intacto o catálogo já publicado.
      - name: Validar site estático sem fila
        if: steps.fila.outputs.tem != 'true' && (steps.noticias.outputs.mudou == 'true' || (github.event_name == 'workflow_dispatch' || github.event_name == 'push'))
        run: python -u scripts/validar.py
      - name: Preparar artefato do site sem fila
        if: steps.fila.outputs.tem != 'true' && (steps.noticias.outputs.mudou == 'true' || (github.event_name == 'workflow_dispatch' || github.event_name == 'push'))
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          origem = Path('site')
          destino = Path('estado/publicacao')
          if destino.exists():
              shutil.rmtree(destino)
          shutil.copytree(origem, destino)
          dados = (destino / 'catalogo.json').read_bytes()
          marcador = {
              'jobId': 'visual-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'],
              'catalogoSha256': hashlib.sha256(dados).hexdigest(),
          }
          (destino / 'publicacao.json').write_text(
              json.dumps(marcador, ensure_ascii=False), encoding='utf-8'
          )
          print('Artefato visual preparado sem modificar imóveis nem planilha.')
          PY
      - name: Verificar artefato visual
        if: steps.fila.outputs.tem != 'true' && (steps.noticias.outputs.mudou == 'true' || (github.event_name == 'workflow_dispatch' || github.event_name == 'push'))
        run: python -u scripts/verificar_publicacao.py --artefato
      - name: Salvar notícias sem fila de imóveis
        if: steps.fila.outputs.tem != 'true' && (steps.noticias.outputs.mudou == 'true' || (github.event_name == 'workflow_dispatch' || github.event_name == 'push'))
        run: |
          git config user.name 'imoplace-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A site
          if ! git diff --cached --quiet; then
            git commit -m "Imoplace: atualização de notícias"
            git push
          fi
      - name: Configurar GitHub Pages
        if: steps.fila.outputs.tem == 'true' || steps.noticias.outputs.mudou == 'true' || (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        uses: actions/configure-pages@v5
      - name: Enviar artefato
        if: steps.fila.outputs.tem == 'true' || steps.noticias.outputs.mudou == 'true' || (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-attempt-${{ github.run_attempt }}
          path: ./estado/publicacao
      # A API de artefatos às vezes ainda não lista o artefato recém-finalizado ("Found 0 artifact(s)").
      # A primeira tentativa não derruba o job; se falhar, espera e tenta de novo (essa sim derruba).
      - name: Publicar GitHub Pages
        id: deploy
        continue-on-error: true
        if: steps.fila.outputs.tem == 'true' || steps.noticias.outputs.mudou == 'true' || (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-attempt-${{ github.run_attempt }}
      - name: Aguardar artefato antes de nova tentativa
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - name: Publicar GitHub Pages (nova tentativa)
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-attempt-${{ github.run_attempt }}
      - name: '[7/8] Conferir publicação real'
        if: steps.fila.outputs.tem == 'true'
        run: python -u scripts/conferir.py
      - name: '[8/8] Feedback individual no Sheets'
        id: feedback
        if: steps.fila.outputs.tem == 'true'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python -u scripts/confirmar.py
      - name: Enviar avisos de notícias já publicadas
        continue-on-error: true
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python -u scripts/push_notificar.py
      - name: Registrar erro por imóvel
        if: failure() && steps.fila.outputs.tem == 'true' && steps.feedback.outcome != 'success'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          MOTIVO_FALHA: 'GitHub Actions interrompido; consultar log do workflow.'
        run: python -u scripts/publicar.py falha
