name: Publicar ImoPlace — CORE
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      motivo:
        description: Origem da solicitação
        required: false
        default: manual
      forcar:
        description: Reprocessar imóveis com erro (não faz reconstrução completa)
        type: boolean
        required: false
        default: false

concurrency:
  group: imoplace-publicar
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
    env:
      CORE_GOOGLE: '1'
      PLANILHA_ID: ${{ secrets.PLANILHA_ID || vars.PLANILHA_ID }}
      FORCAR: ${{ inputs.forcar || 'false' }}
      MOTIVO: ${{ inputs.motivo || github.event_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Autenticar Google (Sheets leitura/escrita, Drive somente leitura)
        id: google
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets,https://www.googleapis.com/auth/drive.readonly
          create_credentials_file: false
      - name: Carregar configurações operacionais do CORE
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python -u scripts/core_configurar.py
      - name: Testes do CORE sem rede
        run: |
          python -m unittest discover -s scripts/tests -t scripts
      - name: '[1/8] Consultar FILA na planilha'
        id: fila
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python -u scripts/sincronizar.py
      - name: '[2/8] Construir catálogo candidato'
        if: steps.fila.outputs.tem == 'true'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python -u scripts/montar_catalogo.py
      - name: '[3/8] Construir páginas e obter fotos'
        if: steps.fila.outputs.tem == 'true'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python -u scripts/montar_imoveis.py
      - name: '[4/8] Gerar sitemap e feeds'
        if: steps.fila.outputs.tem == 'true'
        run: python -u scripts/montar_extras.py
      - name: '[5/8] Validar conteúdo'
        if: steps.fila.outputs.tem == 'true'
        run: python -u scripts/validar.py
      - name: '[6/8] Montar artefato'
        if: steps.fila.outputs.tem == 'true'
        run: python -u scripts/montar_site.py
      - name: Verificar estrutura pública
        if: steps.fila.outputs.tem == 'true'
        run: python -u scripts/verificar_publicacao.py --artefato
      - name: Validar versões antes de publicar
        if: steps.fila.outputs.tem == 'true'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python -u scripts/publicar.py validar-reserva
      - name: Commit das páginas e fotos
        if: steps.fila.outputs.tem == 'true'
        run: |
          git config user.name 'imoplace-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A site
          if ! git diff --cached --quiet; then
            git commit -m "ImoPlace CORE: publicação ${{ github.run_id }}"
            git push
          fi
      # Publicação manual de ajustes visuais, quando nenhum imóvel precisa sincronizar.
      # Não reserva nem confirma versões de imóveis; mantém intacto o catálogo já publicado.
      - name: Validar site estático sem fila
        if: steps.fila.outputs.tem != 'true' && github.event_name == 'workflow_dispatch'
        run: python -u scripts/validar.py
      - name: Preparar artefato do site sem fila
        if: steps.fila.outputs.tem != 'true' && github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          origem = Path('site')
          destino = Path('estado/publicacao')
          if destino.exists():
              shutil.rmtree(destino)
          shutil.copytree(origem, destino)
          dados = (destino / 'catalogo.json').read_bytes()
          marcador = {
              'jobId': 'visual-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'],
              'catalogoSha256': hashlib.sha256(dados).hexdigest(),
          }
          (destino / 'publicacao.json').write_text(
              json.dumps(marcador, ensure_ascii=False) + '\\n', encoding='utf-8'
          )
          print('Artefato visual preparado sem modificar imóveis nem planilha.')
          PY
      - name: Verificar artefato visual
        if: steps.fila.outputs.tem != 'true' && github.event_name == 'workflow_dispatch'
        run: python -u scripts/verificar_publicacao.py --artefato
      - name: Configurar GitHub Pages
        if: steps.fila.outputs.tem == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5
      - name: Enviar artefato
        if: steps.fila.outputs.tem == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./estado/publicacao
      - name: Publicar GitHub Pages
        if: steps.fila.outputs.tem == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/deploy-pages@v4
      - name: '[7/8] Conferir publicação real'
        if: steps.fila.outputs.tem == 'true'
        run: python -u scripts/conferir.py
      - name: '[8/8] Feedback individual no Sheets'
        if: steps.fila.outputs.tem == 'true'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python -u scripts/confirmar.py
      - name: Registrar erro por imóvel
        if: failure() && steps.fila.outputs.tem == 'true'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          MOTIVO_FALHA: 'GitHub Actions interrompido; consultar log do workflow.'
        run: python -u scripts/publicar.py falha
