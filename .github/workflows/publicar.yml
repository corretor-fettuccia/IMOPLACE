        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          create_credentials_file: false
      - name: '[2/8] Montar catálogo candidato'
        if: steps.fila.outputs.tem == 'true'
        run: python -u scripts/montar_catalogo.py
      - name: '[3/8] Montar imóveis e baixar WebP incrementais'
        if: steps.fila.outputs.tem == 'true'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python -u scripts/montar_imoveis.py
      - name: '[4/8] Montar sitemap, robots e feeds'
        if: steps.fila.outputs.tem == 'true'
        run: python -u scripts/montar_extras.py
      - name: '[5/8] Validar publicação'
        if: steps.fila.outputs.tem == 'true'
        run: python -u scripts/validar.py
      - name: '[6/8] Montar artefato público'
        if: steps.fila.outputs.tem == 'true'
        run: python -u scripts/montar_site.py
      - name: Conferir artefato público e index na raiz
        if: steps.fila.outputs.tem == 'true'
        run: python -u scripts/verificar_publicacao.py --artefato
      - name: Verificar reserva de versões antes de publicar
        if: steps.fila.outputs.tem == 'true'
        run: python -u scripts/publicar.py validar-reserva
      - name: Commit de imagens e páginas (apenas mudanças)
        if: steps.fila.outputs.tem == 'true'
        run: |
          git config user.name 'imoplace-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A site
          if git diff --cached --quiet; then
            echo 'Sem alterações em site/'
          else
            git commit -m "ImoPlace v2.3.2.8: publicação ${{ github.run_id }}"
            git push
          fi
      - name: Configurar GitHub Pages
        if: steps.fila.outputs.tem == 'true'
        uses: actions/configure-pages@v5
      # O conteúdo de estado/publicacao/ (cópia validada de site/) vira / do domínio.
      # Não usar main → /(root) nem main → /docs em Settings → Pages.
      - name: Enviar artefato público (raiz do domínio)
        if: steps.fila.outputs.tem == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./estado/publicacao
      - name: Deploy GitHub Pages
        id: deploy
        if: steps.fila.outputs.tem == 'true'
        uses: actions/deploy-pages@v4
      - name: '[7/8] Conferir site publicado'
        if: steps.fila.outputs.tem == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.deploy.outputs.page_url }}
        run: python -u scripts/conferir.py
      - name: '[8/8] Confirmar publicação ao painel'
        if: steps.fila.outputs.tem == 'true'
        run: python -u scripts/confirmar.py
      - name: Reportar erro e liberar fila
        if: failure() && steps.fila.outputs.tem == 'true'
        env:
          MOTIVO_FALHA: 'Erro na publicação v2.3.2.8; consulte GitHub Actions.'
        run: python -u scripts/publicar.py falha
