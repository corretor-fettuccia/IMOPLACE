<script>
/* Imoplace 3.3.1: este complemento deve ser incluído após PainelJs. */
(function(){
  'use strict';
  var apiAnterior331=api;
  api=function(fn){
    var args=Array.prototype.slice.call(arguments,1);
    var route=fn==='enviarImagem'?'enviarImagemFormato331':fn==='substituirImagem'?'substituirImagemFormato331':fn;
    return apiAnterior331.apply(null,[route].concat(args));
  };
  function mostrarFormato331(formato){
    var label=document.querySelector('#zona-envio .meta');
    if(label)label.textContent='Formato padrão: '+formato.toUpperCase()+'. A marca d\u2019água é aplicada antes de salvar. Clique na estrela para escolher a capa.';
  }
  converter=async function(arquivo,marca){
    var formato=await apiAnterior331('obterFormatoPadraoImagens331');
    mostrarFormato331(formato);
    var bmp;
    try{bmp=await createImageBitmap(arquivo);}catch(e){throw new Error(arquivo.name+': o navegador não abriu a imagem. Envie o JPG/PNG original.');}
    try{
      if(bmp.width*bmp.height>50000000)throw new Error('Imagem acima de 50 megapixels.');
      var canvas=document.createElement('canvas');canvas.width=bmp.width;canvas.height=bmp.height;
      var g=canvas.getContext('2d',{willReadFrequently:true});
      if(formato==='jpeg'){g.fillStyle='#ffffff';g.fillRect(0,0,canvas.width,canvas.height);}
      g.drawImage(bmp,0,0);aplicarMarcaDagua(g,canvas.width,canvas.height,marca);
      var blob;
      if(formato==='jxl'){
        var codec=await codecJxl();
        blob=new Blob([await codec.encodeLossless(g.getImageData(0,0,canvas.width,canvas.height))],{type:'image/jxl'});
      }else{
        var mime='image/'+formato;
        blob=await new Promise(function(ok,fail){
          canvas.toBlob(function(result){if(!result||result.type!==mime)fail(new Error('Este navegador não gera '+formato+'. Selecione outro formato nas propriedades.'));else ok(result);},mime,0.92);
        });
      }
      var scale=Math.min(1,240/Math.max(bmp.width,bmp.height)),mini=document.createElement('canvas');
      mini.width=Math.max(1,Math.round(bmp.width*scale));mini.height=Math.max(1,Math.round(bmp.height*scale));mini.getContext('2d').drawImage(canvas,0,0,mini.width,mini.height);
      var base64=await new Promise(function(ok,fail){var reader=new FileReader();reader.onload=function(){ok(String(reader.result).split(',')[1]);};reader.onerror=fail;reader.readAsDataURL(blob);});
      return {nome:arquivo.name.replace(/\.[^.]+$/,''),base64:base64,formato:formato,miniatura:mini.toDataURL('image/webp',0.65),largura:canvas.width,altura:canvas.height};
    }finally{if(bmp.close)bmp.close();}
  };
  apiAnterior331('obterFormatoPadraoImagens331').then(mostrarFormato331).catch(function(e){if(typeof erro==='function')erro(e);});
})();
</script>
